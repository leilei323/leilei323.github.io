<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>手表网页测试</title>
<style>
:root { font-family: -apple-system, BlinkMacSystemFont, sans-serif; color-scheme: light dark; }
body { margin: 0; padding: 20px 12px 32px; line-height: 1.55; overflow-wrap: anywhere; }
main { max-width: 400px; margin: auto; }
.tag { color: #208c70; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
h1 { font-size: 24px; line-height: 1.2; margin: 12px 0; }
p { font-size: 16px; }
section { margin: 20px 0; padding-top: 12px; border-top: 1px solid #8887; }
h2 { font-size: 17px; margin: 0 0 6px; }
small { color: #888; }
</style>
</head>
<body><main>
<div class="tag">APPLE WATCH · 测试页</div>
<h1>你打开啦！</h1>
<p>如果你能在手表上看到这段文字，说明这个网页已经成功加载。</p>
<section><h2>一条示例消息</h2><p>今天也记得抬头看看天空。</p><small>这只是示例内容。</small></section>
<section><h2>再往下滑一滑</h2><p>这里是第二段文字，用来测试小屏幕上的滚动和阅读。</p></section>
<section><h2>接下来</h2><p>确定网页可以打开后，我们再一起决定这里放什么信息。</p></section>
</main></body></html>
